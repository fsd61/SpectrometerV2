[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrometerv2"
version = "2.0.0.dev0"
description = "Modular, cross-platform scientific spectrometer application."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Frank DiGennaro" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
usb = ["opencv-python>=4.5"]     # USB / webcam acquisition
pi = ["picamera2>=0.3"]          # Raspberry Pi camera (installed on the Pi)
plot = ["matplotlib>=3.5"]    # PNG spectrum + waterfall rendering
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
spectrometerv2 = "app.main:main"

# Flat src layout: top-level packages (app, config, cameras, ...) plus a couple
# of loose modules (errors, logging_setup) live directly under src/.
# NOTE: these are generic top-level names; installed into a shared environment
# they can shadow third-party modules. The worst case, `platform` (stdlib), has
# been renamed to `platforms`. Revisit the remaining names (app, config, data,
# ui) before publishing installable artifacts.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["errors", "logging_setup"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
