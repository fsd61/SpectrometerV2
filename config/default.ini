# SpectrometerV2 default configuration (CFG-002: INI is the preferred format).
# Every key is documented in src/config/schema.py (CFG-004).
# Override any value without editing this file via:
#   spectrometerv2 --set section.key=value      (CFG-006)
# Overlay a named profile from config/profiles/<name>.ini via:
#   spectrometerv2 --profile <name>             (CFG-003)

[general]
platform = auto

[logging]
level = INFO
directory = logs
max_bytes = 1048576
backup_count = 5
console = true

[camera]
backend = auto
on_missing = prompt
device_index = 0
width = 1920
height = 1080

[processing]
slice_row = -1

[calibration]
file = config/calibration.json

[synthetic]
wavelength_min = 380.0
wavelength_max = 750.0
sample_interval = 0.5
fwhm = 2.0
snr = 100.0
baseline = 0.0
baseline_slope = 0.0
profile_type = gaussian
seed = 0
